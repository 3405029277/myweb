      <section class="main-column">

              <h2>留言板</h2>
            </div>

          <div class="comment-compose-card">

              <div>
                <h3>评论区</h3>
                <p id="authStatus" class="auth-state warn">未登录</p>

            <div class="hero-actions auth-inline-actions">
              <button class="button primary" id="btnLogin" type="button">登录</button>

              <button class="button" id="btnResetPwd" type="button">忘记密码</button>
              <button class="button" id="btnLogout" type="button" disabled>退出登录</button>

            <p class="comment-page-key">当前页面 key：<code id="pageKey"></code></p>
            <div id="replyTarget" class="reply-target"></div>
            <textarea id="commentInput" rows="5" placeholder="写点什么吧……" disabled></textarea>
            <div class="comment-submit-row">
              <p id="commentTip">未登录时无法发表评论。</p>
              <button class="button primary" id="btnPost" type="button" disabled>发表评论</button>
