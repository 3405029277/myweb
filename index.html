<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人博客 · 主页</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-soft: #dbeafe;
      --shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    }

    .page {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 32px 6vw 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 18px;
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.35);
    }

    .hero {
      padding: 0 6vw 48px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 28px;
      align-items: center;
    }

    .hero-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: var(--shadow);
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 3vw, 40px);
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .meta-grid {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
    }

    .meta-item {
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 13px;
      color: var(--muted);
    }

    .links {
      display: grid;
      gap: 16px;
    }

    .link-card {
      padding: 18px 20px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .link-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 30px rgba(15, 23, 42, 0.12);
    }

    .link-card h2 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .link-card span {
      color: var(--muted);
      font-size: 13px;
    }

    .link-card a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      text-decoration: none;
      color: var(--primary);
      background: var(--primary-soft);
      font-weight: 600;
      border: 1px solid transparent;
    }

    .section {
      padding: 0 6vw 56px;
    }

    .section h3 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .placeholder {
      padding: 20px;
      border-radius: 16px;
      border: 1px dashed var(--border);
      color: var(--muted);
      background: #f9fafb;
      line-height: 1.6;
    }

    footer {
      margin-top: auto;
      padding: 24px 6vw 32px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 720px) {
      header {
        padding-top: 24px;
      }

      .hero-card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <div class="brand-mark">梁</div>
        <div>
          <div>个人博客</div>
          <small style="color: var(--muted);">记录思考，也保存热爱</small>
        </div>
      </div>
    </header>

    <section class="hero">
      <div class="hero-card">
        <h1>你好，欢迎来到我的主页</h1>
        <p>这里未来会放置我的文章、项目展示和生活记录。当前先整理了两个小游戏入口，之后会持续补充内容。</p>
        <div class="meta-grid">
          <div class="meta-item">正在整理：博客栏目</div>
          <div class="meta-item">即将更新：项目集</div>
          <div class="meta-item">计划上线：个人简历</div>
        </div>
      </div>

      <div class="links">
        <div class="link-card">
          <div>
            <h2>五子棋</h2>
            <span>在线对战 + AI 模式</span>
          </div>
          <a href="gomoku.html" target="_blank" rel="noopener">打开游戏 →</a>
        </div>

        <div class="link-card">
          <div>
            <h2>象棋</h2>
            <span>规则透明版</span>
          </div>
          <a href="xiangqi.html" target="_blank" rel="noopener">打开游戏 →</a>
        </div>
      </div>
    </section>

    <section class="section">
      <h3>未来内容</h3>
      <div class="placeholder">
        这里会逐步添加博客分类、近期文章、个人作品集等模块。你可以继续在这个区域扩展列表、时间线或卡片布局。
      </div>
    </section>

    <footer>
      © 2024 个人博客 · 保留所有权利
    </footer>
  </div>
</body>
</html>
